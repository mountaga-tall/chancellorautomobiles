name: Generate Chancellor PWA icons
on:
  push:
    branches: [main]
    paths:
      - 'assets/chancellor-logo-3d.png'
      - 'scripts/generate-pwa-icons.py'
      - '.github/workflows/generate-pwa-icons.yml'
permissions:
  contents: write
jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --upgrade Pillow
      - name: Remove white background and generate transparent logo plus PWA icons
        run: python scripts/generate-pwa-icons.py
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/chancellor-logo-3d-transparent.png assets/favicon-48.png assets/favicon-192.png assets/favicon-512.png assets/apple-touch-icon.png assets/favicon.ico
          if git diff --cached --quiet; then
            echo "PWA icons are already up to date."
          else
            git commit -m "Generate PWA icons from Chancellor sparkling logo"
            git push
          fi
