<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="t d">
<title id="t">Pièces détachées automobiles</title><desc id="d">Composition vectorielle détaillée de pièces automobiles : disque de frein, batterie, filtre, amortisseur et outils.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152d"/><stop offset=".5" stop-color="#10396b"/><stop offset="1" stop-color="#030a18"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#1d91e8" stop-opacity=".65"/><stop offset="1" stop-color="#07152d" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".28" stop-color="#8e9fb2"/><stop offset=".52" stop-color="#f4fbff"/><stop offset=".85" stop-color="#475a70"/><stop offset="1" stop-color="#e8f7ff"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd75c"/><stop offset=".45" stop-color="#ff8913"/><stop offset="1" stop-color="#b92a08"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#85e5ff"/><stop offset=".4" stop-color="#087cda"/><stop offset="1" stop-color="#032758"/></linearGradient>
 <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="15"/><feOffset dy="15"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1100" height="680" rx="24" fill="url(#bg)"/><ellipse cx="565" cy="350" rx="490" ry="330" fill="url(#halo)"/>
<g fill="none" stroke="#4abaff" opacity=".22"><circle cx="550" cy="340" r="270" stroke-width="2"/><circle cx="550" cy="340" r="315"/></g>
<g filter="url(#shadow)">
 <!-- brake rotor -->
 <g transform="translate(270 355)">
  <circle r="190" fill="#1e2b3a" stroke="url(#metal)" stroke-width="18"/><circle r="148" fill="#28384b" stroke="#91a7bf" stroke-width="9"/><circle r="88" fill="url(#metal)" stroke="#26384d" stroke-width="14"/><circle r="43" fill="#0a182b" stroke="#bccbd7" stroke-width="12"/>
  <g fill="#07152d" stroke="#bcc9d4" stroke-width="5"><circle cx="0" cy="-122" r="10"/><circle cx="86" cy="-86" r="10"/><circle cx="122" cy="0" r="10"/><circle cx="86" cy="86" r="10"/><circle cx="0" cy="122" r="10"/><circle cx="-86" cy="86" r="10"/><circle cx="-122" cy="0" r="10"/><circle cx="-86" cy="-86" r="10"/></g>
  <path d="M83 -157Q173 -173 203 -83L160 -44Q145 -105 83 -115Z" fill="url(#orange)" stroke="#ffdf9b" stroke-width="8"/>
 </g>
 <!-- battery -->
 <g transform="translate(650 420)"><rect x="-80" y="-125" width="165" height="210" rx="20" fill="#15283f" stroke="#d3e5f4" stroke-width="9"/><rect x="-64" y="-100" width="132" height="85" rx="9" fill="#0c1a2c" stroke="#365c84" stroke-width="4"/><path d="M-14 -84L-34 -43H-8L-25 -8L29 -59H3L17 -84Z" fill="#eaf5ff"/><rect x="-52" y="-140" width="44" height="22" rx="5" fill="#e64a2c"/><rect x="24" y="-140" width="44" height="22" rx="5" fill="#dbe7f2"/><path d="M-52 40H58" stroke="#4e7298" stroke-width="7"/></g>
 <!-- oil filter -->
 <g transform="translate(835 480) rotate(18)"><rect x="-45" y="-120" width="90" height="215" rx="24" fill="url(#blue)" stroke="#b3efff" stroke-width="7"/><ellipse cy="-120" rx="43" ry="14" fill="#e4faff" stroke="#54728a" stroke-width="6"/><path d="M-26 -84H25M-26 -70H25M-26 -56H25" stroke="#b4e9ff" stroke-width="5"/></g>
 <!-- shock absorber -->
 <g transform="translate(967 260) rotate(12)"><rect x="-24" y="-135" width="48" height="275" rx="18" fill="#202d3d" stroke="url(#metal)" stroke-width="8"/><path d="M-28 -90Q-90 -67 -26 -42Q38 -17 -27 8Q-88 33 -26 60" stroke="url(#orange)" stroke-width="18" fill="none"/><circle cy="-145" r="30" fill="#111d2c" stroke="url(#metal)" stroke-width="10"/><circle cy="148" r="30" fill="#111d2c" stroke="url(#metal)" stroke-width="10"/></g>
</g>
<g stroke="url(#metal)" stroke-width="17" stroke-linecap="round" fill="none" opacity=".95"><path d="M455 150L560 255"/><path d="M560 150L455 255"/></g>
<g font-family="Arial,sans-serif"><text x="70" y="73" fill="#ffbe39" font-size="18" font-weight="700" letter-spacing="5">CHANCELLOR AUTOMOBILE</text><text x="70" y="108" fill="#a4c9e9" font-size="12" letter-spacing="4">PARTS  /  PRECISION  /  PERFORMANCE</text><text x="1030" y="610" text-anchor="end" fill="#fff" font-size="14" font-weight="700" letter-spacing="3">LA BONNE PIÈCE. SANS APPROXIMATION.</text></g>
<path d="M775 80H1030" stroke="url(#orange)" stroke-width="6" stroke-linecap="round"/>
</svg>